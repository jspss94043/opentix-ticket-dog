name: OPENTIX Ticket Dog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patrol:
    runs-on: ubuntu-latest

    steps:
      - name: Get dog files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Patrol OPENTIX
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python -m py_compile cloud_monitor.py
          python cloud_monitor.py

      - name: Remember dog state
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- cloud_state.json)" ]; then
            git config user.name "opentix-ticket-dog"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add cloud_state.json
            git commit -m "Update dog state"
            git push
          else
            echo "🐕 票況沒有變，不需要更新記憶。"
          fi
