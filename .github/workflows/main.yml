name: OPENTIX Ticket Dog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  patrol:
    runs-on: ubuntu-latest

    steps:
      - name: Get dog files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Patrol OPENTIX
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python -m py_compile cloud_monitor.py
          python cloud_monitor.py

      - name: Remember dog state
        if: always()
        run: |
          git config user.name "opentix-ticket-dog"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add cloud_state.json 2>/dev/null || true
          git add debug_ticket_page.txt 2>/dev/null || true

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update dog state"
            git push
          else
            echo "🐕 沒有新的票況資料需要保存。"
          fi
