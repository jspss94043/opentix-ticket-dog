name: OPENTIX Ticket Dog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opentix-ticket-dog
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 4

    container:
      image: mcr.microsoft.com/playwright/python:v1.65.0-noble

    steps:
      - name: Get dog files
        uses: actions/checkout@v4

      - name: Install Playwright Python package
        run: |
          pip install playwright==1.65.0

      - name: Patrol OPENTIX
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python -m py_compile cloud_monitor.py
          python cloud_monitor.py

      - name: Remember dog state
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "opentix-ticket-dog"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add cloud_state.json 2>/dev/null || true
          git add debug_ticket_page.txt 2>/dev/null || true

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update dog state"
            git push
          else
            echo "🐕 沒有新的票況資料需要保存。"
          fi
